<title>螢光筆暴走 Highlighter Gone Wild</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖍%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: one-screen app — quiet top bar, lesson sidebar, reading column with section tabs.
   Minimal: sky blue #7BAFC8 for actions, light yellow paper, hairlines instead of boxes. */
:root{
  --bg:#F6F2E8; --paper:#ffffff; --sunk:#efe9da; --ink:#24343c; --muted:#76838a; --line:#e6dfcd;
  --accent:#7BAFC8; --accent-ink:#11303f; --accent-text:#3a7590; --accent-soft:#e7f1f6; --py:#5a8fa8;
  --ok:#2f8a55; --ok-soft:#e3f4e9; --bad:#c0463e; --bad-soft:#fbe6e3; --note:#fff5cf; --note-line:#e6c55a;
  --hl-y:#ffe17a; --hl-g:#c4ecc4; --hl-p:#ffcfd9; --hl-b:#c8e2f0; --hl-ink:#1b1b1b;
  --shadow:rgba(36,52,60,.10); --scrim:rgba(36,52,60,.35);
  --fs:24px; --radius:14px;
  --zh:"Noto Serif TC","Microsoft JhengHei","PingFang TC","Heiti TC",serif;
  --ui:"Inter","Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  --head:"Inter","Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--sunk)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{font-family:var(--zh);line-height:1.6}
.spacer{flex:1}
[data-ro] .rw{display:none!important}

/* top bar */
header{display:flex;align-items:center;gap:8px 10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.2px}
.brand .logo{width:34px;height:34px;display:block}
.seal{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--zh);font-size:17px}
.crumb{color:var(--muted);font-family:var(--zh);font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg button{border:0;border-radius:0;padding:6px 11px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:18px;text-align:center;margin-left:4px}
.status{font-size:12px;color:var(--muted)}
.chip-sync{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip-sync.ok{background:var(--accent-soft);color:var(--accent-text)}

/* layout */
.wrap{flex:1;display:flex;min-height:0}
.aud-bar{background:var(--paper);border-radius:14px;padding:10px 14px;margin:0 0 14px;box-shadow:0 1px 2px var(--shadow);display:flex;flex-direction:column;gap:6px}
.aud-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.aud-lab{font-family:var(--zh);font-weight:600;color:var(--accent-text);white-space:nowrap}
.aud-slot{flex:1;min-width:220px}.aud-slot audio{width:100%;height:36px;display:block}
.aud-sync{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.aud-sync .status{flex:1}
.cx-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}.cx-time{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px}
.cx-all,.cx-zoom{width:100%;display:block;border-radius:10px;background:var(--sunk);cursor:pointer;touch-action:none}
.cx-sel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 8px}.cx-num{color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.cx-text{font-family:var(--zh);font-size:18px;flex:1;min-width:160px}.cx-grp{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:9px;padding:2px 4px 2px 10px}
.cx-list{max-height:30vh;overflow:auto;margin-top:10px}
.as-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line)}
.as-row.on{background:var(--accent-soft)}.as-n{width:22px;color:var(--muted);font-size:12px}.as-t{width:56px;font-variant-numeric:tabular-nums;color:var(--accent-text)}.as-s{flex:1;font-family:var(--zh)}
.wsnav{display:flex;gap:4px;padding:6px 16px 0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto}
.wsnav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:9px 16px;font-size:15px;color:var(--muted);white-space:nowrap;font-family:var(--zh)}
.wsnav button small{font-family:var(--ui);font-size:11px;margin-left:6px;opacity:.8}
.wsnav button.on{border-bottom-color:var(--accent);color:var(--accent-text);font-weight:600}
body.ws-page #side,body.ws-page #btnSide,body.ws-page #crumb,body.ws-page #fmtBar,body.ws-page #btnNotes,body.ws-page #btnExport,body.ws-page #stuChip{display:none!important}
.st-filter{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.st-filter button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.st-badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:9px;font-weight:600;white-space:nowrap;font-family:var(--zh)}
.st-badge.s0{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st-badge.s1{background:color-mix(in srgb,#d08a00 18%,transparent);color:#b07400}
.st-badge.s2{background:var(--line);color:var(--muted)}
.st-badge.s3{background:var(--accent-soft);color:var(--accent-text)}
table.lt tr.stopped td{opacity:.6}
.fx-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.fx-row:last-child{border-bottom:0}
.fx-row .field{margin:0}
.fx-row input{width:110px}
.inc-big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
aside.side{width:230px;flex:none;background:var(--bg);border-right:1px solid var(--line);overflow:auto;padding:12px 10px}
aside.side.hide{display:none}
.book>.bh{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;font-family:var(--zh);font-weight:600;font-size:16px}
.book>.bh:hover{background:var(--sunk)}
.book>.bh .cnt{margin-left:auto;font-family:var(--ui);font-size:12px;color:var(--muted);font-weight:400}
.lessons{padding-left:10px;margin-bottom:6px}
.lesson{padding:6px 10px;border-radius:7px;cursor:pointer;font-family:var(--zh);font-size:15px;display:flex;gap:6px;align-items:center}
.lesson:hover{background:var(--sunk)}
.lesson.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.lesson .dot{width:7px;height:7px;border-radius:50%;background:var(--note-line);margin-left:auto;flex:none}
.folder>.fh{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;font-family:var(--zh);font-weight:700;font-size:16px;color:var(--accent-text)}
.folder>.fh:hover{background:var(--sunk)}
.folder>.fh .cnt{margin-left:auto;font-family:var(--ui);font-size:12px;color:var(--muted);font-weight:400}
.folder .fic{font-size:14px}
.fbooks{padding-left:10px;border-left:1px solid var(--line);margin:0 0 6px 14px}
.addl{font-size:13px;color:var(--muted);padding:6px 10px;cursor:pointer}
.addl:hover{color:var(--accent-text)}
.side-foot{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:2px}
.side-foot button{text-align:left}

main{flex:1;overflow:auto;min-width:0}
.inner{max-width:980px;margin:0 auto;padding:18px 24px 80px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:10px 14px;font-size:14px;color:var(--muted);white-space:nowrap}
.tab .zht{font-family:var(--zh);font-size:17px;margin-right:6px;color:var(--ink)}
.tab.on{border-bottom-color:var(--accent);color:var(--accent-text)}
.tab.on .zht{color:var(--accent-text)}
.tabs .tools{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:6px}
.tabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}.tabs .tab{flex:none}.tabs .tools button{white-space:nowrap}.tabs .tools{position:sticky;right:0;background:var(--bg);padding-left:8px}
.card{background:var(--paper);border:0;border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;box-shadow:0 1px 2px var(--shadow)}
.lesson-title{font-family:var(--zh);font-size:28px;font-weight:600;margin:4px 0 16px;text-wrap:balance}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .big{font-family:var(--zh);font-size:22px;color:var(--ink);margin-bottom:8px}
h3.sec{font-family:var(--zh);font-size:19px;margin:22px 0 10px;color:var(--accent-text)}
.banner{background:var(--note);border:1px solid var(--note-line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}

/* Chinese text */
.zh{font-family:var(--zh);font-size:var(--fs);line-height:2.25}
body.py-off .zh{line-height:1.9}
.zh ruby{ruby-position:over}
.zh rt{font-family:var(--ui);font-size:.42em;color:var(--py);letter-spacing:0;user-select:none;-webkit-user-select:none}
body.py-zy .zh rt{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:.36em}
.zc{display:inline-flex;align-items:center}
.zv{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:.4em;line-height:1.02;color:var(--py);margin:0 .15em 0 .06em;user-select:none;-webkit-user-select:none}
.zv.tm{margin-right:.85em}
.zv b{font-weight:400}
.zv i{font-style:normal}
.zv .zm{position:absolute;left:100%;top:50%;transform:translate(.05em,-55%)}
.zv .zn{line-height:.55}
body.py-zy .zh{line-height:2.1}
body.py-off .zh rt{display:none}
.zh .w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .12s}
.zh .w:hover{background:var(--sunk);box-shadow:inset 0 -2px 0 var(--accent)}
.zh .hl-y,.zh .hl-g,.zh .hl-p,.zh .hl-b{color:var(--hl-ink)}
.zh .hl-y rt,.zh .hl-g rt,.zh .hl-p rt,.zh .hl-b rt{color:#7a4510}
.zh .hl-y{background:var(--hl-y)!important}.zh .hl-g{background:var(--hl-g)!important}
.zh .hl-p{background:var(--hl-p)!important}.zh .hl-b{background:var(--hl-b)!important}
.nm{font-family:var(--ui);font-size:11px;font-weight:700;background:var(--note-line);color:#1b1b1b;border-radius:8px;padding:1px 5px;margin:0 2px;cursor:pointer;vertical-align:super;line-height:1}
.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--accent);border-radius:6px}100%{box-shadow:none}}
.para{display:flex;gap:12px;align-items:flex-start;padding:4px 0}
.para .spk{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--accent-soft);flex:none}
.av.ini{display:grid;place-items:center;font-family:var(--zh);font-size:20px;font-weight:600;color:var(--accent-text)}
.spk .sn{font-family:var(--zh);font-size:12px;color:var(--muted);text-align:center;max-width:64px;line-height:1.2;word-break:break-all}
.drop{display:flex;align-items:center;justify-content:center;min-height:130px;border:2px dashed var(--line);border-radius:14px;background:var(--sunk);color:var(--muted);cursor:pointer;text-align:center;padding:16px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.thumbs .th{position:relative}.thumbs img{height:120px;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:4px;right:4px;background:var(--paper);padding:2px 7px}
.shot-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.shot-cv{width:100%;border-radius:8px;border:1px solid var(--line);touch-action:none;cursor:crosshair;display:block}
.srow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.srow.on{border-color:var(--accent);background:var(--accent-soft)}
.srow canvas,.srow img{width:52px;height:52px;border-radius:50%;flex:none;background:var(--sunk);object-fit:cover}
.srow input[type=text]{width:100%;min-width:0;font-family:var(--zh)}
.srow .sd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:12px}
@media (max-width:760px){.shot-grid{grid-template-columns:1fr}}
.ro{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px;padding:8px;border-radius:12px;background:var(--sunk);border:2px dashed transparent;min-height:56px}
.ro.ok{border-color:var(--ok);background:var(--ok-soft)}.ro.no{border-color:var(--bad);background:var(--bad-soft)}
.ro .tl{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px var(--shadow)}
.ro .tl .zh{font-size:calc(var(--fs)*.85);line-height:1.9}.ro .tl .w{cursor:grab}
.ro .tl.dragging{cursor:grabbing;position:relative;z-index:20;box-shadow:0 8px 20px var(--shadow);border-color:var(--accent)}
.bal{color:var(--ok);font-weight:600}
.tk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.tk:last-child{border-bottom:0}
.tk-k{flex:none;width:96px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding-top:10px}
.tk-mistake .tk-k{color:var(--bad)}.tk-good .tk-k{color:var(--ok)}.tk-word .tk-k{color:var(--accent-text)}
.tk-said .zh{font-size:calc(var(--fs)*.85)}
.tk-mistake .tk-said .zh{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1px}
.tk-fix{color:var(--ok)}.tk-fix .zh{font-size:calc(var(--fs)*.85)}.tk-arrow{font-weight:700}
 (max-width:760px){.tk-k{width:70px}}
.fest-bar{display:flex;gap:12px;align-items:flex-start;background:#fff7d6;border:1px solid #f0dc8f;border-radius:14px;padding:10px 14px;margin-bottom:12px}
.fest-row+.fest-row{margin-top:8px;padding-top:8px;border-top:1px dashed #ead9a0}
.fest-seal{flex:none;width:30px;height:30px;border-radius:8px;background:#c8463a;color:#fff;display:inline-grid;place-items:center;font-family:var(--zh);font-weight:700;font-size:16px}
.linkish{border:0;background:none;padding:0 4px;color:var(--accent-text);text-decoration:underline;font-size:13px}
.fest-sec{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.fest-words{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.fw{display:flex;flex-direction:column;background:var(--sunk);border-radius:10px;padding:8px 10px;position:relative}
.fw .vw .zh{font-size:22px;line-height:1.9}.fw .say{position:absolute;right:4px;top:4px;padding:2px 6px}
.fest-cal{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fest-cal .fd{width:58px;flex:none;font-weight:700;font-size:17px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.spk.pick{cursor:pointer;border-radius:10px;padding:4px 2px}
.spk.pick:hover{background:var(--sunk)}
.av.add{border:2px dashed var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;font-size:18px}
.spk.empty{opacity:.5}.para:hover .spk.empty{opacity:1}
.spk-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;margin-top:10px;max-height:260px;overflow:auto}
.spk-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;font-family:var(--zh);font-size:13px}
.spk-opt .av{width:40px;height:40px}.spk-opt .av.ini{font-size:17px}
.spk-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.oa{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.oa-said{width:100%;font-family:var(--zh);font-size:calc(var(--fs)*.7);min-height:44px}
.oa-fix{width:100%;font-family:var(--zh);font-size:calc(var(--fs)*.65);border-color:var(--ok);color:var(--ok);min-height:38px}
.oa-fix::placeholder{color:var(--muted)}
.lesson .done{margin-left:auto;color:var(--ok);font-weight:700;font-family:var(--ui)}
.gimg-add{float:right;font-size:13px;padding:3px 8px;margin:-6px -8px 0 8px}
.gimg{margin:12px 0;text-align:center}
.gimg img{max-width:100%;max-height:420px;border-radius:12px;box-shadow:0 1px 3px var(--shadow)}
.gimg figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.gimg-x{font-size:12px;padding:2px 8px;display:block;margin:4px auto 0;color:var(--muted)}
.sv{background:var(--paper);border-radius:14px;box-shadow:0 1px 2px var(--shadow);overflow:hidden}
.sv-stage{display:flex;align-items:center;justify-content:center;background:#1d2428;min-height:240px;aspect-ratio:16/9;max-width:100%}
.sv-stage canvas,.sv-stage img{max-width:100%;max-height:100%;display:block;object-fit:contain}
.sv-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.sv:fullscreen{display:flex;flex-direction:column;border-radius:0;background:#000}
.sv:fullscreen .sv-stage{flex:1;aspect-ratio:auto;min-height:0}
.sv:fullscreen .sv-bar{background:var(--paper)}
#langSel{padding:5px 8px;font-size:13px;max-width:120px}
.chip-stu{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px 3px 4px;background:var(--accent-soft);border-color:transparent;font-family:var(--zh);font-weight:600}
.chip-stu .status{font-family:var(--ui);font-weight:400}
.side-foot button.on{background:var(--accent-soft);color:var(--accent-text)}
.log-head{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.log-month{display:flex;align-items:center;gap:8px;margin:6px 0 14px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile2{background:var(--paper);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px var(--shadow)}
.tile2 .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tile2 .v{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}

.lt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}

  const el = n.nodeType === 3 ? n.parentElement : n; const HLS = 'mark.f-hl, .f-hl, [style*="background"]';

  while (hl.parentElement && hl.parentElement !== box && hl.parentElement.closest(HLS) && box.contains(hl.parentElement)) hl = hl.parentElement;
  const plain = r => { const d = document.createElement('div'); d.appendChild(r.cloneContents()); $$(WB_SKIP, d).forEach(x => x.remove()); return d.textContent.replace(/\u200b/g, ''); };
  const pre = document.createRange(); pre.selectNodeContents(hl); pre.setEnd(n, off); const before = plain(pre);
  const whole = document.createRange(); whole.selectNodeContents(hl); const all = plain(whole);
  const atEnd = before.length >= all.length, atStart = !before.length && all.length > 0;
  if (!atEnd && !atStart) return;
  const t = document.createTextNode('\u200b'); if (atEnd) hl.after(t); else hl.before(t);
  const r = document.createRange(); r.setStart(t, atEnd ? 1 : 0); r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
  return true;
}

function wbFormat(ed, key) {

      if (a > s0) out.push({ ...x, t: x.t.slice(0, a - s0) }); out.push({ ...x, t: x.t.slice(a - s0, b - s0), [key]: !all }); if (b < e0) out.push({ ...x, t: x.t.slice(b - s0) }); }
